services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ulaznice
      POSTGRES_PASSWORD: ulaznice
      POSTGRES_DB: ulaznice
    ports:
      - "5432:5432"
    volumes:
      - ulaznice_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulaznice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ulaznice_pg:
